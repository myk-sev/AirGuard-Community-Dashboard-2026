{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Community indoor PM2.5 readings, forecasts, and health guidance.">
  <title>{% block title %}AirGuard{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}">
  <script defer src="{% static 'dashboard/app.js' %}"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
  <header class="site-header">
    <div class="community-band" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="header-inner">
      <div class="header-top">
        <a class="brand" href="{% url 'dashboard:home' %}" aria-label="AirGuard home">
          <span class="brand-mark" aria-hidden="true">AG</span>
          <span><span class="brand-name">AirGuard</span><span class="brand-tagline" data-i18n="tagline">Community air, made clearer</span></span>
        </a>
        <label class="language-control">
          <span data-i18n="language">Language</span>
          <select id="language-select" aria-label="Language">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </label>
      </div>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{% url 'dashboard:home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %} data-i18n="home">Home</a>
        <a href="{% url 'dashboard:readings' %}" {% if request.resolver_match.url_name == 'readings' or request.resolver_match.url_name == 'building' %}aria-current="page"{% endif %} data-i18n="readings">Current readings</a>
        <a href="{% url 'dashboard:resources' %}" {% if request.resolver_match.url_name == 'resources' %}aria-current="page"{% endif %} data-i18n="resources">Resources</a>
        <a href="{% url 'dashboard:notifications' %}" {% if request.resolver_match.url_name == 'notifications' %}aria-current="page"{% endif %} data-i18n="signup">Sign up</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>AirGuard</span><span data-i18n="sensorFooter">Indoor low-cost sensor data for community guidance.</span></footer>
  {% block dialogs %}{% endblock %}
</body>
</html>

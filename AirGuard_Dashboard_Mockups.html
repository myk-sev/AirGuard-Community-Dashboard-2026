  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;airguard-prototype&quot;);
      const pages = [...root.querySelectorAll(&quot;[data-view]&quot;)];
      const navButtons = [...root.querySelectorAll(&quot;.nav-button&quot;)];
      const dialog = root.querySelector(&quot;#sensor-dialog&quot;);
      const aqiDialog = root.querySelector(&quot;#aqi-dialog&quot;);
      const buildingNames = [&quot;Riverside Community Center&quot;, &quot;Eastview School&quot;, &quot;Northside Library&quot;];
      const buildingIcons = [&quot;landmark&quot;, &quot;school&quot;, &quot;library&quot;];
      const buildingStatuses = [
        { label: &quot;Moderate&quot;, cls: &quot;moderate&quot; },
        { label: &quot;Good&quot;, cls: &quot;&quot; },
        { label: &quot;Unhealthy for sensitive groups&quot;, cls: &quot;sensitive&quot; }
      ];

      const translations = {
        es: {
          skip: &quot;Saltar al contenido principal&quot;, tagline: &quot;El aire comunitario, más claro&quot;, language: &quot;Idioma&quot;,
          home: &quot;Inicio&quot;, readings: &quot;Lecturas actuales&quot;, resources: &quot;Recursos&quot;, signup: &quot;Inscribirse&quot;,
          updated: &quot;Actualizado hace 10 minutos&quot;, communityStatus: &quot;Aire interior en edificios participantes&quot;,
          statusIntro: &quot;Una vista sencilla de las condiciones reportadas por los sensores AirGuard en espacios comunitarios.&quot;,
          moderate: &quot;Moderado&quot;, statusMessage: &quot;La mayoría de las personas pueden continuar sus actividades normales. Las personas sensibles a la contaminación por partículas pueden reducir el esfuerzo.&quot;,
          current: &quot;Actual:&quot;, of: &quot;de&quot;, reporting: &quot;sensores reportando&quot;, forecast: &quot;Pronóstico:&quot;,
          sensitive: &quot;Insalubre para grupos sensibles&quot;, byThree: &quot;a las 3 p. m.&quot;, chooseBuilding: &quot;Elija un edificio&quot;,
          buildingIntro: &quot;Vea las lecturas del gimnasio, pasillo y entrada.&quot;, allBuildings: &quot;Todos los edificios&quot;,
          currentReadingsTitle: &quot;Lecturas actuales&quot;, readingsIntro: &quot;Seleccione un edificio participante para ver sus sensores interiores.&quot;,
          clickBuilding: &quot;Seleccione cualquier tarjeta de edificio para ver las lecturas de su gimnasio, pasillo y entrada.&quot;,
          backBuildings: &quot;Volver a edificios&quot;, buildingDetailIntro: &quot;Lecturas interiores de PM2.5 de tres espacios compartidos.&quot;,
          gym: &quot;Gimnasio&quot;, hallway: &quot;Pasillo&quot;, entrance: &quot;Entrada&quot;, good: &quot;Bueno&quot;,
          whatMeans: &quot;Qué significa&quot;, meansText: &quot;PM2.5 está compuesto por partículas diminutas que pueden penetrar profundamente en los pulmones. El AQI convierte la lectura en una categoría de salud más fácil de entender.&quot;,
          learnMore: &quot;Más información&quot;, whatDo: &quot;Qué puede hacer&quot;, actionOne: &quot;Elija una sala con una lectura más baja cuando sea posible.&quot;,
          actionTwo: &quot;Las personas con asma o afecciones cardíacas deben seguir su plan de atención.&quot;,
          actionThree: &quot;Revise nuevamente antes de realizar actividad intensa.&quot;, resourcesTitle: &quot;Recursos sobre la calidad del aire&quot;,
          resourcesIntro: &quot;Actividades, cuentos, orientación de salud y herramientas prácticas para familias, estudiantes y grupos comunitarios.&quot;,
          learnTeach: &quot;Aprender y enseñar&quot;, familiesKids: &quot;Para familias y niños&quot;, communityAction: &quot;Acción comunitaria&quot;, healthGuidance: &quot;Salud y orientación sobre el AQI&quot;, sensorLimits: &quot;Acerca de estos sensores&quot;,
          sensorLimitsText: &quot;AirGuard utiliza sensores interiores de bajo costo como orientación comunitaria. Estas lecturas no son mediciones reglamentarias del aire ambiente.&quot;,
          signupTitle: &quot;Reciba notificaciones sobre la calidad del aire&quot;, signupIntro: &quot;Elija un edificio y el nivel de AQI para recibir una notificación.&quot;,
          email: &quot;Correo electrónico&quot;, building: &quot;Edificio&quot;, notifyAt: &quot;Notificarme en&quot;, moderateAbove: &quot;Moderado o superior&quot;,
          sensitiveAbove: &quot;Insalubre para grupos sensibles o superior&quot;, unhealthyAbove: &quot;Insalubre o superior&quot;,
          consent: &quot;Acepto recibir notificaciones por correo electrónico de AirGuard. El envío se añadirá en una fase posterior.&quot;,
          savePreference: &quot;Guardar preferencia&quot;, saved: &quot;Su preferencia se guardó para este prototipo.&quot;,
          facilityEyebrow: &quot;Acceso para administradores de instalaciones&quot;, facilityTitle: &quot;Notificaciones de alertas del edificio&quot;,
          facilityIntro: &quot;Este formulario no listado guarda preferencias de notificación a nivel del edificio.&quot;, workEmail: &quot;Correo electrónico del trabajo&quot;,
          history: &quot;Historial&quot;, pmHistory: &quot;Historial de PM2.5&quot;, timeRange: &quot;Intervalo&quot;, viewTable: &quot;Ver tabla de datos&quot;,
          time: &quot;Hora&quot;, category: &quot;Categoría&quot;, downloadCsv: &quot;Descargar CSV&quot;, peakForecast: &quot;Pronóstico máximo: insalubre para grupos sensibles a las 3 p. m.&quot;,
          forecastAction: &quot;Las personas sensibles a la contaminación por partículas deberían considerar una sala con una lectura más baja durante la tarde.&quot;,
          temperature: &quot;Temperatura&quot;, humidity: &quot;Humedad relativa&quot;, windSpeed: &quot;Velocidad del viento&quot;, windDirection: &quot;Dirección del viento&quot;,
          next24: &quot;Próximas 24 horas&quot;, forecastUpdated: &quot;Pronóstico actualizado a las 10 a. m.&quot;,
          whatAqi: &quot;¿Qué significa AQI?&quot;, aqiExplanation: &quot;El AQI convierte una medición de PM2.5 en una categoría de salud. Un número más alto significa más contaminación por partículas y una mayor posibilidad de efectos en la salud.&quot;,
          goodGuidance: &quot;La calidad del aire es satisfactoria para la mayoría de las personas.&quot;, moderateGuidance: &quot;Las personas inusualmente sensibles a la contaminación por partículas pueden notar efectos.&quot;,
          sensitiveGuidance: &quot;Los niños y las personas con afecciones cardíacas o pulmonares deben reducir el esfuerzo prolongado.&quot;, indoorNote: &quot;AirGuard aplica categorías de salud del AQI a lecturas de sensores interiores de bajo costo como orientación comunitaria. No es un informe reglamentario del AQI exterior.&quot;, close: &quot;Cerrar&quot;
        }
      };

      function renderBuildings() {
        root.querySelectorAll(&quot;[data-building-grid]&quot;).forEach((grid) =&gt; {
          grid.innerHTML = buildingNames.map((name, index) =&gt; {
            const status = buildingStatuses[index];
            return `&lt;button class=&quot;card building-card tone-${index + 1}&quot; type=&quot;button&quot; data-open-building=&quot;${name}&quot;&gt;
              &lt;span class=&quot;location-icon&quot;&gt;&lt;i data-lucide=&quot;${buildingIcons[index]}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;
              &lt;span&gt;&lt;span class=&quot;building-name&quot;&gt;${name}&lt;/span&gt;&lt;span class=&quot;building-status&quot;&gt;&lt;span class=&quot;mini-dot ${status.cls}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;${status.label} · ${index === 0 ? &quot;3/3&quot; : index === 1 ? &quot;3/3&quot; : &quot;2/3&quot;} sensors&lt;/span&gt;&lt;/span&gt;
            &lt;/button&gt;`;
          }).join(&quot;&quot;);
        });
        root.querySelectorAll(&quot;[data-open-building]&quot;).forEach((button) =&gt; {
          button.addEventListener(&quot;click&quot;, () =&gt; {
            root.querySelector(&quot;#building-title&quot;).textContent = button.dataset.openBuilding;
            showView(&quot;building&quot;);
          });
        });
        globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function showView(view) {
        pages.forEach((page) =&gt; page.classList.toggle(&quot;is-active&quot;, page.dataset.view === view));
        navButtons.forEach((button) =&gt; {
          const active = button.dataset.nav === view || (view === &quot;building&quot; &amp;&amp; button.dataset.nav === &quot;readings&quot;);
          if (active) button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
          else button.removeAttribute(&quot;aria-current&quot;);
        });
        root.querySelector(`[data-view=&quot;${view}&quot;]`)?.scrollIntoView({ block: &quot;start&quot; });
      }

      root.querySelectorAll(&quot;[data-nav]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; showView(button.dataset.nav)));

      root.addEventListener(&quot;click&quot;, (event) =&gt; {
        const button = event.target.closest(&quot;[data-sensor]&quot;);
        if (!button) return;
        root.querySelector(&quot;#sensor-dialog-title&quot;).textContent = button.dataset.sensor;
        try {
          dialog.showModal();
        } catch {
          dialog.setAttribute(&quot;open&quot;, &quot;&quot;);
        }
      });
      root.querySelector(&quot;[data-close-dialog]&quot;).addEventListener(&quot;click&quot;, () =&gt; dialog.close());
      root.querySelector(&quot;[data-open-aqi]&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        try {
          aqiDialog.showModal();
        } catch {
          aqiDialog.setAttribute(&quot;open&quot;, &quot;&quot;);
        }
      });
      root.querySelectorAll(&quot;[data-close-aqi]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; aqiDialog.close()));

      root.querySelectorAll(&quot;[data-dialog-tab]&quot;).forEach((tab) =&gt; {
        tab.addEventListener(&quot;click&quot;, () =&gt; {
          const selected = tab.dataset.dialogTab;
          root.querySelectorAll(&quot;[data-dialog-tab]&quot;).forEach((item) =&gt; item.setAttribute(&quot;aria-selected&quot;, String(item === tab)));
          root.querySelectorAll(&quot;.dialog-panel&quot;).forEach((panel) =&gt; panel.classList.toggle(&quot;is-active&quot;, panel.id === `${selected}-panel`));
        });
      });

      const historySets = {
        &quot;24h&quot;: [8, 9, 7, 8, 10, 12, 14, 18, 16, 13, 11, 9, 8, 9, 12, 14, 15, 13, 11, 10, 9, 8, 9, 10],
        &quot;7d&quot;: [7, 8, 9, 12, 16, 11, 8, 7, 9, 13, 18, 15, 10, 8, 9, 12, 17, 14, 9, 7, 8, 11, 16, 12, 8, 7, 10, 14],
        &quot;30d&quot;: [8, 9, 11, 13, 10, 8, 9, 12, 16, 14, 11, 8, 7, 9, 13, 17, 15, 10, 8, 9, 12, 14, 11, 9, 8, 10, 13, 16, 12, 9]
      };
      const forecastValues = [10, 10, 11, 12, 14, 16, 19, 24, 30, 37, 42, 39, 34, 29, 24, 20, 17, 15, 13, 12, 11, 10, 9, 9];

      function drawChart(svg, values) {
        const width = 760, height = 280, left = 48, right = 18, top = 18, bottom = 38;
        const max = Math.max(45, ...values);
        const x = (i) =&gt; left + (i / (values.length - 1)) * (width - left - right);
        const y = (v) =&gt; top + (1 - v / max) * (height - top - bottom);
        const path = values.map((v, i) =&gt; `${i ? &quot;L&quot; : &quot;M&quot;} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(&quot; &quot;);
        let markup = &quot;&quot;;
        [0, 10, 20, 30, 40].forEach((tick) =&gt; {
          markup += `&lt;line class=&quot;chart-grid&quot; x1=&quot;${left}&quot; y1=&quot;${y(tick)}&quot; x2=&quot;${width-right}&quot; y2=&quot;${y(tick)}&quot;&gt;&lt;/line&gt;&lt;text class=&quot;chart-axis&quot; x=&quot;8&quot; y=&quot;${y(tick)+4}&quot;&gt;${tick}&lt;/text&gt;`;
        });
        markup += `&lt;path class=&quot;chart-line&quot; d=&quot;${path}&quot;&gt;&lt;/path&gt;`;
        values.forEach((v, i) =&gt; {
          if (i % Math.max(1, Math.floor(values.length / 8)) === 0 || i === values.length - 1) {
            markup += `&lt;circle class=&quot;chart-point&quot; cx=&quot;${x(i)}&quot; cy=&quot;${y(v)}&quot; r=&quot;4&quot;&gt;&lt;title&gt;${v} micrograms/m3&lt;/title&gt;&lt;/circle&gt;`;
          }
        });
        markup += `&lt;text class=&quot;chart-axis&quot; x=&quot;${left}&quot; y=&quot;${height-8}&quot;&gt;Earlier&lt;/text&gt;&lt;text class=&quot;chart-axis&quot; x=&quot;${width-right-26}&quot; y=&quot;${height-8}&quot;&gt;Now&lt;/text&gt;`;
        svg.querySelectorAll(&quot;line,path,circle,text&quot;).forEach((node) =&gt; node.remove());
        svg.insertAdjacentHTML(&quot;beforeend&quot;, markup);
      }

      function renderHistory(range) {
        const values = historySets[range];
        drawChart(root.querySelector(&quot;#history-chart&quot;), values);
        const body = root.querySelector(&quot;#history-table-body&quot;);
        body.innerHTML = values.slice(-8).map((value, index) =&gt; {
          const aqi = Math.round(value * 4.2);
          const category = aqi &lt;= 50 ? &quot;Good&quot; : aqi &lt;= 100 ? &quot;Moderate&quot; : &quot;Unhealthy for sensitive groups&quot;;
          return `&lt;tr&gt;&lt;td&gt;${index + 3}:00 PM&lt;/td&gt;&lt;td&gt;${value.toFixed(1)} micrograms/m3&lt;/td&gt;&lt;td&gt;${aqi}&lt;/td&gt;&lt;td&gt;${category}&lt;/td&gt;&lt;/tr&gt;`;
        }).join(&quot;&quot;);
      }
      drawChart(root.querySelector(&quot;#forecast-chart&quot;), forecastValues);
      renderHistory(&quot;24h&quot;);
      root.querySelector(&quot;#history-range&quot;).addEventListener(&quot;change&quot;, (event) =&gt; renderHistory(event.target.value));

      root.querySelector(&quot;#download-data&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        const values = historySets[root.querySelector(&quot;#history-range&quot;).value];
        const rows = [&quot;timestamp,pm25_ug_m3,aqi,category,data_status&quot;];
        values.forEach((value, index) =&gt; {
          const aqi = Math.round(value * 4.2);
          const category = aqi &lt;= 50 ? &quot;Good&quot; : aqi &lt;= 100 ? &quot;Moderate&quot; : &quot;Unhealthy for sensitive groups&quot;;
          rows.push(`2026-07-10T${String(index).padStart(2, &quot;0&quot;)}:00:00-04:00,${value.toFixed(1)},${aqi},${category},current`);
        });
        const url = URL.createObjectURL(new Blob([rows.join(&quot;\n&quot;)], { type: &quot;text/csv&quot; }));
        const link = document.createElement(&quot;a&quot;);
        link.href = url;
        link.download = &quot;airguard-hallway-readings.csv&quot;;
        link.click();
        URL.revokeObjectURL(url);
      });

      root.querySelectorAll(&quot;.mock-form&quot;).forEach((form) =&gt; {
        form.addEventListener(&quot;submit&quot;, (event) =&gt; {
          event.preventDefault();
          form.querySelector(&quot;.form-message&quot;).classList.add(&quot;is-visible&quot;);
        });
      });

      root.querySelector(&quot;#ag-language&quot;).addEventListener(&quot;change&quot;, (event) =&gt; {
        const lang = event.target.value;
        root.setAttribute(&quot;lang&quot;, lang);
        root.querySelectorAll(&quot;[data-i18n]&quot;).forEach((element) =&gt; {
          if (!element.dataset.en) element.dataset.en = element.textContent;
          element.textContent = lang === &quot;es&quot; &amp;&amp; translations.es[element.dataset.i18n] ? translations.es[element.dataset.i18n] : element.dataset.en;
        });
      });

      renderBuildings();
      const initialView = location.hash.replace(&quot;#&quot;, &quot;&quot;);
      if (pages.some((page) =&gt; page.dataset.view === initialView)) showView(initialView);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
